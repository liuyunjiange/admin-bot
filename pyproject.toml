[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "demo-account-bot"
version = "0.1.0"
description = "Deterministic Feishu bot service for creating model-platform demo accounts"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "lark-oapi==1.4.18",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "ruff==0.11.2",
]

[project.scripts]
demo-account-bot = "demo_account_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_account_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
